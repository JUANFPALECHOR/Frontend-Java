<app-header></app-header>
<app-notification></app-notification>
<div class="create-category-container">
  <h2>Crear Nueva Categoría</h2>
  
  <!-- Formulario para crear una nueva categoría -->
  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    
    <!-- Campo de entrada para el nombre de la categoría -->
    <div>
      <label for="name">Nombre de la Categoría:</label>
      
      <!-- Componente reutilizable para el input -->
      <app-input
        id="name"
        formControlName="name"
        [required]="true"
        [minlength]="1"
        [maxlength]="50">
      </app-input>

      <!-- Mostrar mensajes de error si el campo de nombre no es válido -->
      <div *ngIf="categoryForm?.get('name')?.invalid && categoryForm?.get('name')?.touched">
        <small *ngIf="categoryForm?.get('name')?.errors?.['required']">Este campo es requerido</small>
        <small *ngIf="categoryForm?.get('name')?.errors?.['minlength']">Debe tener al menos 1 carácter</small>
        <small *ngIf="categoryForm?.get('name')?.errors?.['maxlength']">No puede exceder 50 caracteres</small>
      </div>
    </div>

    <!-- Campo de entrada para la descripción de la categoría -->
    <div>
      <label for="description">Descripción:</label>
      
      <!-- Componente reutilizable para el textarea -->
      <app-textarea
        id="description"
        formControlName="description"
        [required]="true"
        [maxlength]="90">
      </app-textarea>

      <!-- Mostrar mensajes de error si el campo de descripción no es válido -->
      <div *ngIf="categoryForm?.get('description')?.invalid && categoryForm?.get('description')?.touched">
        <small *ngIf="categoryForm?.get('description')?.errors?.['required']">Este campo es requerido</small>
        <small *ngIf="categoryForm?.get('description')?.errors?.['maxlength']">No puede exceder 90 caracteres</small>
      </div>
    </div>

    <!-- Botón para enviar el formulario, reutilizando el componente 'app-button' -->
    <app-button
      class="btn-create"
      label="Crear Categoría"
      icon="Save"
      type="submit"
      [disabled]="categoryForm.invalid">
    </app-button>
  </form>

  <hr>

  <h2>Categorías</h2>

  <!-- Botones para ordenar las categorías -->
  <div class="sort-controls">
    <!-- Ordenar de forma ascendente -->
    <app-button label="A-Z" 
       class="btn-pagination"
      (click)="getCategories(0, 10, 'ASC')" 
      (keydown.enter)="getCategories(0, 10, 'ASC')">
    </app-button>

    <!-- Ordenar de forma descendente -->
    <app-button label="Z-A"
       class="btn-pagination"
      (click)="getCategories(0, 10, 'DESC')" 
      (keydown.enter)="getCategories(0, 10, 'DESC')">
    </app-button>
  </div>

  <hr>

  <!-- Lista de categorías en formato de tabla -->
  <div class="category-list">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
        </tr>
      </thead>
      <tbody>
        <!-- Itera sobre las categorías obtenidas y muestra los datos -->
        <tr *ngFor="let category of categories">
          <td>{{ category.id }}</td>
          <td>{{ category.name }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Controles de paginación para navegar entre páginas de categorías -->
  <div class="pagination-container">
    <!-- Botón para ir a la página anterior -->
    <app-button 
      class="btn-pagination"
      label="&#8592;" 
      (click)="getCategories(currentPage - 1, 10, currentSortDirection)" 
      [disabled]="currentPage === 0"
      (keydown)="handleKeyPress($event)">
      
    </app-button>

    <!-- Números de páginas con condicionales -->
    <span class="pagination-container" *ngIf="currentPage > 1" (click)="getCategories(0, 10, currentSortDirection)" (keydown)="handleKeyPress($event)">1</span>
    <span class="pagination-container" *ngIf="currentPage > 2">...</span>

    <span class="pagination-container" *ngIf="currentPage > 0" (click)="getCategories(currentPage - 1, 10, currentSortDirection)" (keydown)="handleKeyPress($event)">
      {{ currentPage }}
    </span>
    <span class="pagination-container active">{{ currentPage + 1 }}</span> <!-- Página actual -->
    <span class="pagination-container" *ngIf="currentPage + 1 < totalPages" (click)="getCategories(currentPage + 1, 10, currentSortDirection)" (keydown)="handleKeyPress($event)">
      {{ currentPage + 2 }}
    </span>

    <!-- Botón para ir a la página siguiente -->
    <app-button 
      class="btn-pagination"
      label="&#8594;" 
      (click)="getCategories(currentPage + 1, 10, currentSortDirection)" 
      [disabled]="!hasMoreCategories"
      (keydown)="handleKeyPress($event)">
    </app-button>
  </div>
</div>
